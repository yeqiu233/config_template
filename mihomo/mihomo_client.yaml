  - {name: '🔯 故障转移', type: 'fallback', include-all-providers: true, empty-fallback: REJECT, exclude-filter: '(?i)网站|网址|地址|剩余|流量重置|过期|到期|有效期|套餐|公告|官网|直连|direct|群组|客服|重置', exclude-type: 'Direct|Reject|Pass', url: 'https://www.google.com/generate_204', interval: 300, lazy: true, expected-status: '204'}
  - {name: '♻️ 自动选择', type: 'url-test', include-all-providers: true, empty-fallback: REJECT, exclude-filter: '(?i)网站|网址|地址|剩余|流量重置|过期|到期|有效期|套餐|公告|官网|直连|direct|群组|客服|重置', exclude-type: 'Direct|Reject|Pass', url: 'https://www.google.com/generate_204', interval: 300, lazy: true, expected-status: '204', tolerance: 50}
  - {name: '🐸 手动切换', type: 'select', include-all-providers: true, empty-fallback: REJECT, exclude-filter: '(?i)网站|网址|地址|剩余|流量重置|过期|到期|有效期|套餐|公告|官网|直连|direct|群组|客服|重置', exclude-type: 'Direct|Reject|Pass'}
  - {name: '🌐 全部节点', type: 'select', include-all-providers: true, empty-fallback: REJECT, exclude-filter: '(?i)网站|网址|地址|剩余|流量重置|过期|到期|有效期|套餐|公告|官网|直连|direct|群组|客服|重置', exclude-type: 'Direct|Reject|Pass'}
# ==================== 路由规则（自上而下） ====================
# 注意：特定业务分组 > IP 专项 > 国内 IP > 宽泛国外域名 > 兜底。
# 不在开头全局禁止 UDP/443，只对指定国外服务的 UDP/443 拦截。
rules:
  # 1. 局域网/Tailscale，不受可切换的国内策略组影响。
  # 此处 no-resolve 仅针对已经有目标 IP 的流量，避免抢先解析全部域名。
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  - 'RULE-SET,local_domain,DIRECT'
  - 'RULE-SET,private_domain,DIRECT'
  - 'RULE-SET,tailscale_domain,DIRECT'
  - 'RULE-SET,dashboard_domain,DIRECT'
  # 可在此添加自有 ERP/企业域名硬直连，例如 DOMAIN-SUFFIX,example.com,DIRECT。
  # 若需客户端也返回真实 IP，同时在 DNS fake-ip-filter 前部加入对应 real-ip 规则。
  # 2. 国内关键应用硬直连；完整继承 sing-box 内嵌域名。
  - 'RULE-SET,wechat_domain,DIRECT'
  - 'RULE-SET,payment_domain,DIRECT'
  - 'RULE-SET,bank_domain,DIRECT'
  - 'RULE-SET,shopping_domain,DIRECT'
  - 'RULE-SET,media_domain,DIRECT'
  - 'RULE-SET,life_domain,DIRECT'
  - 'RULE-SET,office_domain,DIRECT'
  # 3. 仅国外指定服务 UDP/443：近似 sing-box 的按服务 QUIC 拦截。
  - 'AND,((NETWORK,udp),(DST-PORT,443),(OR,((RULE-SET,youtube_domain),(RULE-SET,google_domain),(RULE-SET,ai),(RULE-SET,tiktok_domain),(RULE-SET,netflix_domain),(RULE-SET,google_special_domain)))),REJECT-DROP'
  # 4. BT：本机进程 + 公共 Tracker；不按任意端口一刀切。
  - 'PROCESS-NAME-REGEX,(?i)^(qbittorrent(-nox)?|transmission(-daemon|-gtk|-qt)?|aria2c|utorrent|bittorrent|bitcomet|deluge(d|-gtk)?|tixati|vuze)(\.exe)?$,🌏 BT下载'
  - 'RULE-SET,tracker_domain,🌏 BT下载'
  # 5. 业务域名独立策略。GitHub/YouTube/OneDrive 优先于 Google/Microsoft 等宽类。
  - 'RULE-SET,ai,🤖 ChatGPT'
  - 'RULE-SET,github_domain,👨🏿‍💻 GitHub'
  - 'RULE-SET,youtube_domain,📹 YouTube'
  - 'RULE-SET,google_special_domain,🍀 Google'
  - 'RULE-SET,google_domain,🍀 Google'
  - 'RULE-SET,onedrive_domain,🐬 OneDrive'
  - 'RULE-SET,microsoft_domain,🪟 Microsoft'
  - 'RULE-SET,tiktok_domain,🎵 TikTok'
  - 'RULE-SET,speedtest_domain,✈️ Speedtest'
  - 'RULE-SET,telegram_domain,📲 Telegram'
  - 'RULE-SET,netflix_domain,🎥 NETFLIX'
  - 'RULE-SET,apple_domain,🍎 Apple'
  # 6. 已明确的 GFW 站点仍优先代理，避免污染 IP 把它们误导向直连。
  - 'RULE-SET,gfw_domain,🚀 默认代理'
  - 'RULE-SET,cn_domain,🎯 直连'
  # 7. 关键：这里故意不加 no-resolve。未知域名触发真实 DNS 查询后判断目标 IP。
  - 'RULE-SET,private_ip,DIRECT'
  # 8. 已经触发真实解析，专项 IP 优先于通用国内/国外分流。
  - 'RULE-SET,google_ip,🍀 Google,no-resolve'
  - 'RULE-SET,telegram_ip,📲 Telegram,no-resolve'
  - 'RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve'
  - 'RULE-SET,apple_ip,🍎 Apple,no-resolve'
  # 9. 国内真实 IP 优先于宽泛的国外域名集合。故意不加 no-resolve。
  # 已提前命中的专项域名、GFW 域名不会再走到此规则；GeoIP 结果也取决于真实 DNS 和规则库。
  - 'RULE-SET,cn_ip,🎯 直连'
  - 'RULE-SET,geolocation-!cn,🚀 默认代理'
  - 'MATCH,🐟 漏网之鱼'
# ==================== 规则集 ====================
# 远程规则统一 MRS；国内 APP 等使用内联域名，避免另外托管文件。
# 每个远程规则单独缓存，不依赖 sing-box 的 SRS 文件。
rule-providers:
  private_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/private_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'}
  ai: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/ai.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs'}
  youtube_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/youtube_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs'}
  google_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/google_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs'}
  github_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/github_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs'}
  telegram_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/telegram_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs'}
  netflix_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/netflix_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs'}
  onedrive_domain: {type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT, path: ./ruleset/onedrive_domain.mrs, url: 'https://gh-proxy.com/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs'}
