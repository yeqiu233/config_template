  - {name: '🎥 NETFLIX', type: 'select', proxies: ['🚀 默认代理', '♻️ 自动选择', '🔯 故障转移', '🐸 手动切换', '🇸🇬 新加坡节点', '🇺🇸 美国节点', '🌐 全部节点']}
