  - {name: '🎯 直连', type: 'select', proxies: ['DIRECT', '🚀 默认代理', '♻️ 自动选择', '🔯 故障转移', '🐸 手动切换', '🇸🇬 新加坡节点', '🇺🇸 美国节点', '🌐 全部节点']}
  - {name: '🌏 BT下载', type: 'select', proxies: ['DIRECT', '🚀 默认代理', '♻️ 自动选择', '🔯 故障转移', '🐸 手动切换', '🇸🇬 新加坡节点', '🇺🇸 美国节点', '🌐 全部节点']}
  - {name: '🐟 漏网之鱼', type: 'select', proxies: ['🚀 默认代理', '♻️ 自动选择', '🔯 故障转移', '🐸 手动切换', '🇸🇬 新加坡节点', '🇺🇸 美国节点', '🌐 全部节点', 'DIRECT']}
  # 地区过滤仅用于实际订阅节点。空组使用 REJECT，避免无节点时意外直连。
  - {name: '🇸🇬 新加坡节点', type: 'select', include-all-providers: true, empty-fallback: REJECT, filter: '(?i)🇸🇬|新加坡|狮城|坡西|Singapore|Xinjiapo|(?:^|[^a-z])SG(?:[^a-z]|$)|坡[0-9]', exclude-filter: '(?i)网站|网址|地址|剩余|流量重置|过期|到期|有效期|套餐|公告|官网|直连|direct|群组|客服|重置', exclude-type: 'Direct|Reject|Pass'}
