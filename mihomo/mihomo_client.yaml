# Mihomo 客户端完整订阅模板
# 填写机场1真实 URL，作为完整配置导入支持 Mihomo 的客户端。
# 机场2默认注释；取消整段注释并填写 URL 即可启用。
# 入站、DNS 监听端口、TUN、API、运行模式均由客户端管理。
# 使用支持 fake-ip-filter-mode: rule、inline rule-provider 的新版 Mihomo。
# 客户端应保留本模板 DNS 和规则策略；不支持的客户端需另行适配。
# 规则下载沿用原 gh-proxy.com 镜像；不可用时需要自行更换。
# 订阅 URL 可能包含私人令牌，不要公开填写后的配置。

# ==================== 机场订阅 ====================
# 订阅、规则集下载均默认直连，避免首次启动时依赖尚未加载的节点。
# 两个机场独立缓存、独立更新，并为节点名称添加前缀，避免同名节点冲突。
proxy-providers:
  机场1:
    type: http
    url: 'https://example.com/replace-with-airport-1-subscription' # 替换成机场1的真实订阅链接
    path: ./proxy_providers/airport1.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: 'https://www.google.com/generate_204'
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: '204'
    override:
      additional-prefix: '[机场1] '

  # 机场2:
  #   type: http
  #   url: 'https://example.com/replace-with-airport-2-subscription' # 替换成机场2的真实订阅链接
  #   path: ./proxy_providers/airport2.yaml
  #   interval: 3600
  #   proxy: DIRECT
  #   health-check:
  #     enable: true
  #     url: 'https://www.google.com/generate_204'
  #     interval: 300
  #     timeout: 5000
  #     lazy: false
  #     expected-status: '204'
  #   override:
  #     additional-prefix: '[机场2] '

# 节点由 proxy-providers 自动加载。
proxies: []

ipv6: false
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true

# ==================== DNS ====================
# 国内 DNS 直连，国外已知服务 DNS 走默认代理，未知域名先国内解析供 IP 判定。
# 不启用全局 respect-rules 或 fallback-filter，保留原模板的 DNS 出站策略。
# DNS IP 字面量 + 显式出站，避免节点域名与代理 DNS 相互依赖。
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter-mode: rule
  fake-ip-filter:
    # 本地、Tailscale、国内关键业务优先返回真实地址。
    - 'RULE-SET,local_domain,real-ip'
    - 'RULE-SET,private_domain,real-ip'
    - 'RULE-SET,tailscale_domain,real-ip'
    - 'RULE-SET,dashboard_domain,real-ip'
    - 'RULE-SET,wechat_domain,real-ip'
    - 'RULE-SET,payment_domain,real-ip'
    - 'RULE-SET,bank_domain,real-ip'
    - 'RULE-SET,shopping_domain,real-ip'
    - 'RULE-SET,media_domain,real-ip'
    - 'RULE-SET,life_domain,real-ip'
    - 'RULE-SET,office_domain,real-ip'
    - 'RULE-SET,apple_domain,real-ip'
    - 'RULE-SET,tracker_domain,real-ip'
    - 'RULE-SET,foreign_real_domain,real-ip'
    - 'RULE-SET,extra_real_domain,real-ip'
    # 明确的国外服务优先于 cn_domain，避免交叉规则误命中。
    - 'RULE-SET,ai,fake-ip'
    - 'RULE-SET,github_domain,fake-ip'
    - 'RULE-SET,youtube_domain,fake-ip'
    - 'RULE-SET,google_domain,fake-ip'
    - 'RULE-SET,onedrive_domain,fake-ip'
    - 'RULE-SET,microsoft_domain,fake-ip'
    - 'RULE-SET,tiktok_domain,fake-ip'
    - 'RULE-SET,speedtest_domain,fake-ip'
    - 'RULE-SET,telegram_domain,fake-ip'
    - 'RULE-SET,netflix_domain,fake-ip'
    - 'RULE-SET,gfw_domain,fake-ip'
    - 'RULE-SET,cn_domain,real-ip'
    - 'MATCH,fake-ip'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点域名不依赖代理自身。
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://120.53.53.53/dns-query#DIRECT'
  nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://120.53.53.53/dns-query#DIRECT'
  direct-nameserver:
    - 'https://223.5.5.5/dns-query#DIRECT'
    - 'https://120.53.53.53/dns-query#DIRECT'
  direct-nameserver-follow-policy: true
  nameserver-policy:
    # 本地 DNS 必须能解析局域网域名；若系统 DNS 指回 Mihomo，改成真实 LAN DNS 地址。
    # MagicDNS 需要系统已接入 Tailscale DNS 或配置可达的内网 DNS。
    'rule-set:local_domain,private_domain':
      - system
    'rule-set:tailscale_domain,dashboard_domain':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://120.53.53.53/dns-query#DIRECT'
    'rule-set:wechat_domain,payment_domain,bank_domain,shopping_domain,media_domain,life_domain,office_domain,apple_domain,tracker_domain':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://120.53.53.53/dns-query#DIRECT'
    'rule-set:foreign_real_domain,google_special_domain,ai,github_domain,youtube_domain,google_domain,onedrive_domain,microsoft_domain,tiktok_domain,speedtest_domain,telegram_domain,netflix_domain,gfw_domain':
      - 'https://1.1.1.1/dns-query#🚀 默认代理'
      - 'https://8.8.8.8/dns-query#🚀 默认代理'
    # geolocation-!cn 刻意不指定国外 DNS：宽泛域名集合不能先于国内 IP 判定。
    'rule-set:cn_domain':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://120.53.53.53/dns-query#DIRECT'

# ==================== 域名嗅探 ====================
# 从 TLS/HTTP/QUIC 恢复域名用于分流，但不强制改写原始目标地址。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.ts.net'
    - '+.tailscale.com'
    - '+.tailscale.io'

# ==================== 策略组 ====================
